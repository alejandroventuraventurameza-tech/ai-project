name: IE SOURCE exact fiscal fiber and 33-row root

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentPinnedFiscalFiberWitness.lean
      - .github/workflows/ie-source-pinned-fiscal-fiber.yml

permissions:
  contents: read

concurrency:
  group: ie-source-pinned-fiscal-fiber
  cancel-in-progress: true

jobs:
  fiscal-fiber:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check SOURCE fiscal fiber and stationary root
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentPinnedSourceDateParity.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentPinnedStationaryPrefix33Root.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentPinnedFiscalFiberWitness.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentPinnedFiscalFiberWitness 2>&1 | tee /tmp/fiscal-fiber-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentPinnedFiscalFiberWitness.lean 2>&1 | tee /tmp/fiscal-fiber-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/fiscal-fiber-axioms.log; then exit 2; fi
          grep -F 'pinnedFiscalG_gt_pre_reserves' /tmp/fiscal-fiber-axioms.log
          grep -F 'pinnedFiscalG_household_bonds_pos' /tmp/fiscal-fiber-axioms.log
          grep -F 'pinnedFiscalG_monetary_domain' /tmp/fiscal-fiber-axioms.log
          grep -F 'pinnedFiscalG_carrier_fiscal_closure' /tmp/fiscal-fiber-axioms.log
          grep -F 'pinnedFiscalG_binding_prefix33_root' /tmp/fiscal-fiber-axioms.log
          echo SOURCE_FISCAL_FIBER_KERNEL_OK
      - name: Preserve build and axioms logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-stationary-fiscal-fiber
          path: |
            /tmp/fiscal-fiber-build.log
            /tmp/fiscal-fiber-axioms.log
          if-no-files-found: ignore
