name: IE SOURCE exact pinned binding stationary prefix 33 root

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentPinnedSourceDateParity.lean
      - lean/current/CurrentPinnedStationaryPrefix33Root.lean
      - .github/workflows/ie-source-pinned-stationary33-root.yml

permissions:
  contents: read

concurrency:
  group: ie-source-pinned-stationary33-root
  cancel-in-progress: true

jobs:
  stationary-33-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check actual SOURCE stationary 33-row root
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentPinnedSourceDateParity.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentPinnedStationaryPrefix33Root.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentPinnedStationaryPrefix33Root 2>&1 | tee /tmp/stationary33-root-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentPinnedStationaryPrefix33Root.lean 2>&1 | tee /tmp/stationary33-root-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/stationary33-root-axioms.log; then exit 2; fi
          grep -F 'pinned_stationary_common_pledge_zero' /tmp/stationary33-root-axioms.log
          grep -F 'pinned_stationary_binding_prefix33_root' /tmp/stationary33-root-axioms.log
          echo SOURCE_STATIONARY_33_ROOT_KERNEL_OK
      - name: Preserve build and axioms logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-stationary-binding-33-root
          path: |
            /tmp/stationary33-root-build.log
            /tmp/stationary33-root-axioms.log
          if-no-files-found: ignore
