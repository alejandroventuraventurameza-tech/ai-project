name: IE SOURCE expSecant continuity at exact policy root
on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceExpSecantContinuity.lean
      - .github/workflows/ie-source-expsecant-continuity.yml
permissions:
  contents: read
concurrency:
  group: ie-source-expsecant-continuity
  cancel-in-progress: true
jobs:
  expsecant-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check SOURCE exponential secant continuity
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceFiveBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceExpSecantContinuity.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentSourceExpSecantContinuity 2>&1 | tee /tmp/secant-continuity-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentSourceExpSecantContinuity.lean 2>&1 | tee /tmp/secant-continuity-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/secant-continuity-axioms.log; then exit 2; fi
          grep -F 'expSecant_continuousAt_zero' /tmp/secant-continuity-axioms.log
          grep -F 'expSecant_comp_continuousAt_at_zero' /tmp/secant-continuity-axioms.log
          echo SOURCE_SECANT_CONTINUITY_KERNEL_OK
      - name: Preserve proof and axioms logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-expsecant-continuity
          path: |
            /tmp/secant-continuity-build.log
            /tmp/secant-continuity-axioms.log
          if-no-files-found: ignore
