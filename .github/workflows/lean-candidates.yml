            tail -n 140 "$GITHUB_WORKSPACE/lean-ci-logs/axioms.log"
            exit 1
          }
          cat "$GITHUB_WORKSPACE/lean-ci-logs/axioms.log"
          if grep -E '(sorryAx|Lean\.sorryAx)' "$GITHUB_WORKSPACE/lean-ci-logs/axioms.log"; then
            echo "ERROR: an audited claim depends on sorryAx."
            exit 1
          fi

      - name: Save full compiler logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-candidate-audit-logs
          path: lean-ci-logs/
          if-no-files-found: warn
          retention-days: 30
