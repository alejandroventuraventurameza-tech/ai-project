          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalUtility.firmOptimal_dominates_capitalDeviation
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalNeighborhood.localBounds_eventually_of_strict_slack
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalNeighborhood.exists_twoSided_feasible_optimality_radius
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalGainContinuity.dateOneCapitalGain_continuousAt_zero
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalGainContinuity.exists_twoSided_feasible_optimality_radius_of_interior_slack
