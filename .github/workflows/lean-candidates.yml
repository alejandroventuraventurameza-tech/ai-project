          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCalendarScalarKKT.firmOptimal_binding_actualDual_identified_of_sourceRow
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCalendarScalarKKT.firmOptimal_sourceCalendar_binding_scalarComplementarity_of_positive_prices
