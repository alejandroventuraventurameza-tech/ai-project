          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroDeterministicEulerBridge.firmOptimal_singleSuccessor_capitalEuler
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroDeterministicMarkovBridge.firmOptimal_deterministicTransition_capitalEuler
          #print axioms Ventura26LiquidityAllocation.ProposedOneSidedCollateralMonotonicity.robustCollateral_capital_mono
