          #print axioms Ventura26LiquidityAllocation.ProposedBoundaryEndpointBoxes.endpointSigns_of_verified_components
          #print axioms Ventura26LiquidityAllocation.ProposedBoundaryNormalizationBridge.endpointSigns_of_boxes_and_output_roots
          #print axioms Ventura26LiquidityAllocation.ProposedContinuationContractAudit.not_localExactContinuationAround
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42Audit.localMacroMultiplicitySpec_false
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalRepair.different_prefixes_of_strict_slack_binding
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalRepair.near_primal_replace_dual_right
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalRepair.agreement_primal_replace_dual_right
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalSeparation.strict_slack_and_binding_primal_disjoint
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalSeparation.reduced_dual_unique_of_euler
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalSeparation.reduced_dual_zero_of_strict_slack
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42PrimalSeparation.reduced_slack_zero_of_positive_dual
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42KKTIdentification.capitalEulerResidual_eq_primalGap_sub_dual
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42KKTIdentification.capitalEulerCollateralUnit_pos
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42KKTIdentification.capitalEuler_dual_unique_of_same_primal
          #print axioms Ventura26LiquidityAllocation.ProposedProposition42KKTIdentification.entire_collateralDual_identified_of_euler
          #print axioms Ventura26LiquidityAllocation.ProposedFirmOptimalVariation.firmOptimal_replaceCollateralDual_iff
          #print axioms Ventura26LiquidityAllocation.ProposedFirmOptimalVariation.exists_firmOptimal_without_capitalEuler
          #print axioms Ventura26LiquidityAllocation.ProposedFirmOptimalVariation.firmOptimal_twoSidedVariation_derivative_zero
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalDeviation.variation_wealth_transition_one
          #print axioms Ventura26LiquidityAllocation.ProposedDateZeroCapitalDeviation.capitalDateZeroVariation_feasible
