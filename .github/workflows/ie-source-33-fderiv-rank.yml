name: IE SOURCE 33-row Jacobian injectivity transport

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceTwoDateFDerivRank.lean
      - .github/workflows/ie-source-33-fderiv-rank.yml

permissions:
  contents: read

concurrency:
  group: ie-source-33-fderiv-rank
  cancel-in-progress: true

jobs:
  source-33-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check full-row Jacobian rank bridge
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceFiveBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateFDerivTransport.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateFDerivRank.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentSourceTwoDateFDerivRank 2>&1 | tee /tmp/source-rank-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentSourceTwoDateFDerivRank.lean 2>&1 | tee /tmp/source-rank-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/source-rank-axioms.log; then exit 2; fi
          grep -F 'sourceShearCLM_injective' /tmp/source-rank-axioms.log
          grep -F 'economicLogShearCLM_injective' /tmp/source-rank-axioms.log
          grep -F 'clm_comp_injective_iff' /tmp/source-rank-axioms.log
          grep -F 'targetizedLogPrefix33_jacobian_injective_iff' /tmp/source-rank-axioms.log
          echo SOURCE_33_JACOBIAN_INJECTIVITY_KERNEL_OK
      - name: Preserve kernel and axioms evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-33-jacobian-injectivity
          path: |
            /tmp/source-rank-build.log
            /tmp/source-rank-axioms.log
          if-no-files-found: ignore
