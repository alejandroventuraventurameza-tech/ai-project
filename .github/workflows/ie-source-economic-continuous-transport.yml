name: IE SOURCE economic 33-row targetization with continuous coefficients

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceEconomicContinuousTransport.lean
      - .github/workflows/ie-source-economic-continuous-transport.yml

permissions:
  contents: read

concurrency:
  group: ie-source-economic-continuous-transport
  cancel-in-progress: true

jobs:
  economic-continuous:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check continuous-coefficient actual SOURCE targetized Jacobian
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceFiveBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateFDerivTransport.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceContinuousRootCoefficient.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceContinuousRowShear.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceContinuous33Shear.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceEconomicContinuousTransport.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentSourceEconomicContinuousTransport 2>&1 | tee /tmp/source-economic-continuous-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentSourceEconomicContinuousTransport.lean 2>&1 | tee /tmp/source-economic-continuous-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/source-economic-continuous-axioms.log; then exit 2; fi
          grep -F 'targetizedLogPrefix33_hasFDerivAt_at_root_of_eight_continuous' /tmp/source-economic-continuous-axioms.log
          echo SOURCE_ECONOMIC_CONTINUOUS_TRANSPORT_KERNEL_OK
      - name: Keep build and axioms logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-economic-continuous-fderiv
          path: |
            /tmp/source-economic-continuous-build.log
            /tmp/source-economic-continuous-axioms.log
          if-no-files-found: ignore
