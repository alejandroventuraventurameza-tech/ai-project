name: IE SOURCE economic cross-coefficient continuity from prefactors
on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceCrossContinuity.lean
      - .github/workflows/ie-source-cross-continuity.yml
permissions:
  contents: read
concurrency:
  group: ie-source-cross-continuity
  cancel-in-progress: true
jobs:
  cross-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check genuine SOURCE cross-coefficient continuity
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceFiveBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceExpSecantContinuity.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceCrossContinuity.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentSourceCrossContinuity 2>&1 | tee /tmp/cross-continuity-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentSourceCrossContinuity.lean 2>&1 | tee /tmp/cross-continuity-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/cross-continuity-axioms.log; then exit 2; fi
          grep -F 'prefactor_times_expSecant_continuousAt' /tmp/cross-continuity-axioms.log
          grep -F 'sourceLoanCross_continuousAt_of_prefactor' /tmp/cross-continuity-axioms.log
          grep -F 'sourceDepositCross_continuousAt_of_prefactor' /tmp/cross-continuity-axioms.log
          grep -F 'sourceBalanceRateCross_continuousAt_of_prefactor' /tmp/cross-continuity-axioms.log
          grep -F 'sourceBalanceQuantityCross_continuousAt_of_prefactor' /tmp/cross-continuity-axioms.log
          grep -F 'sourceFourCross_continuousAt_of_prefactors' /tmp/cross-continuity-axioms.log
          echo SOURCE_ECONOMIC_CROSS_CONTINUITY_KERNEL_OK
      - name: Preserve proof and axioms logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-cross-continuity
          path: |
            /tmp/cross-continuity-build.log
            /tmp/cross-continuity-axioms.log
          if-no-files-found: ignore
