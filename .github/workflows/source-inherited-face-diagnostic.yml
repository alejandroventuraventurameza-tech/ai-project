name: SOURCE inherited-face gap diagnostic (numerical)
on:
  push:
    branches:
      - work/lean-ci-validation-otc-20261106
    paths:
      - scripts/audit_source_inherited_nominal_faces.py
      - scripts/audit_source_inherited_nominal_faces_exact_intervals.py
      - .github/workflows/source-inherited-face-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-face-gap:
    name: Detect nonzero inherited-face gap (NOT equilibrium certification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SOURCE review ref
        uses: actions/checkout@v4
      - name: Set up Python standard library
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce 70-digit source diagnostics
        run: |
          set -euo pipefail
          python scripts/audit_source_inherited_nominal_faces.py | tee source-inherited-face-audit.json
          echo "::warning title=SOURCE nominal inheritance::A nonzero gap has been detected NUMERICALLY (about +0.08291496). This passing diagnostic job is NOT a proof of equilibrium; exact Lean interval certification is pending."
      - name: Certify outward-rational intervals using integer arithmetic
        run: |
          set -euo pipefail
          python scripts/audit_source_inherited_nominal_faces_exact_intervals.py | tee source-inherited-face-exact-intervals.json
          echo "::warning title=SOURCE exact integer intervals::The independent formulas enclose the face gap strictly above zero, conditional on source-formula identification and root uniqueness. This is NOT yet kernel-checked Lean."

      - name: Cross-check 70-digit and outward-rational diagnostics
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          with open("source-inherited-face-audit.json") as f:
              decimal = json.load(f)
          with open("source-inherited-face-exact-intervals.json") as f:
              interval = json.load(f)
          root = Decimal(decimal["root_gross_loan_rate"])
          assert Decimal("1.029135") < root < Decimal("1.029136")
          actual_gap = Decimal(decimal["source_boundary_inherited_face_gap"])
          lower, upper = [Decimal(s) for s in interval["inherited_gap_over_entire_bracket"]]
          assert lower < actual_gap < upper
          assert Decimal("0.08") < lower and upper < Decimal("0.09")
          print("Decimal cross-check belongs to the exact-rational interval. No Lean theorem inferred.")
          PY

      - name: Preserve reproducible diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: source-inherited-face-audit
          path: |
            source-inherited-face-audit.json
            source-inherited-face-exact-intervals.json
          if-no-files-found: error
