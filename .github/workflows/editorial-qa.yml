name: editorial-qa
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall -q code

  latex-logs:
    name: Final LaTeX references and layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            proposal/proposal.tex
            slides/topic.tex
            slides/final.tex
            paper/paper.tex
          work_in_root_file_dir: true
      - run: python code/audit_latex_logs.py
