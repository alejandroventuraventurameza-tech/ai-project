name: editorial-qa
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall -q code
      - name: Audit illustrative firm scale without changing calibration
        run: python code/irf/audit_firm_scale.py
      - name: Verify all 33 reduced-prefix rows independently
        run: python code/irf/audit_prefix_rows.py

  latex-logs:
    name: Final LaTeX references and layout
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            proposal/proposal.tex
            slides/topic.tex
            slides/final.tex
            paper/paper.tex
          work_in_root_file_dir: true
      - run: python code/audit_latex_logs.py
      # The official build.yml only checks that PDFs are tracked. This
      # scoped development-branch step also commits current generated bytes.
      - name: Sync freshly compiled PDFs on the development branch
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposal/proposal.pdf slides/topic.pdf slides/final.pdf paper/paper.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDFs already match this commit"
          else
            git commit -m "build(pdf): synchronize compiled artifacts [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
