name: editorial-qa
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: editorial-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall -q code
      - name: Audit illustrative firm scale without changing calibration
        run: python code/irf/audit_firm_scale.py
      - name: Install pinned numerical dependency for the directed interval producer
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5
      - name: Check directed stationary scalar rate and renewal bridge
        run: python code/v0m/certified_ift/audit_stationary_scalar_bridge.py
      - name: Audit same-predecessor S/B local exclusion and bounded root search
        run: python code/irf/frozen_same_predecessor_branch_audit.py
      - name: Preserve S/B root and obstruction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: same-predecessor-branch-diagnostic
          path: code/irf/output/same_predecessor_branch_audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Audit deterministic boundary worker FOC and cubic wage
        run: python code/irf/audit_boundary_labor.py
      - name: Verify all 33 reduced-prefix rows independently
        run: python code/irf/audit_prefix_rows.py
      - name: Check H transmission table is generated from the audited nonlinear solution
        run: python code/irf/render_mechanism_table.py --check
      - name: Audit proposition scope, 57-row ledger and Lean obstruction
        run: python code/audit_claim_scope.py
      - name: Audit all 57 Lean correspondence pointers without promoting theorem coverage
        run: python code/audit_lean_crosswalk.py
      - name: Audit printed branch S-B loss and capital derivative identity
        run: python code/audit_allocation_loss_table.py
      - name: Verify exact-integer SOURCE interval translation (not a Lean certificate)
        run: python scripts/audit_source_inherited_nominal_faces_exact_intervals.py

  latex-logs:
    name: Final LaTeX references and layout
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            proposal/proposal.tex
            slides/topic.tex
            slides/final.tex
            paper/paper.tex
          work_in_root_file_dir: true
      - run: python code/audit_latex_logs.py
      # The official build.yml only checks that PDFs are tracked. This
      # scoped development-branch step also commits current generated bytes.
      - name: Sync freshly compiled PDFs on the development branch
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/') }}
        shell: bash
        run: |
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
          if [ "${remote_sha}" != "${GITHUB_SHA}" ]; then
            echo "Skip stale PDF sync: source ${GITHUB_SHA} is not current head ${remote_sha}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposal/proposal.pdf slides/topic.pdf slides/final.pdf paper/paper.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDFs already match this commit"
          else
            git commit -m "build(pdf): synchronize compiled artifacts [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
