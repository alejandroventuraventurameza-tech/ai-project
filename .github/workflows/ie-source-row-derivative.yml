name: IE SOURCE scalar row derivative proof

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceRowDerivative.lean
      - .github/workflows/ie-source-row-derivative.yml

permissions:
  contents: read

concurrency:
  group: ie-source-row-derivative
  cancel-in-progress: true

jobs:
  scalar-row-derivative:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check scalar derivative lemma
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          lake env lean ../ai-project/lean/current/CurrentSourceRowDerivative.lean 2>&1 | tee /tmp/ie-row-derivative.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/ie-row-derivative.log; then exit 2; fi
          grep -F 'scalar_row_shear_hasDerivAt_at_cross_root' /tmp/ie-row-derivative.log
          echo SOURCE_SCALAR_ROW_DERIVATIVE_KERNEL_OK
      - name: Keep proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-scalar-row-derivative
          path: /tmp/ie-row-derivative.log
          if-no-files-found: ignore
