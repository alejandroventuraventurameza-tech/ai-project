name: IE Proposition 3.1 local scalar bridge

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentCompactProp31LocalBridge.lean
      - lean/current/CurrentCompactProp31C1Bridge.lean
      - .github/workflows/ie-prop31-local-bridge-lean.yml

concurrency:
  group: ie-prop31-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prop31-local-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile bridge and audit proof axioms
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentCompactProp31LocalBridge.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentCompactProp31C1Bridge.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentCompactProp31LocalBridge 2>&1 | tee /tmp/ie-prop31-build.log
          lake build Ventura26LiquidityAllocation.CurrentCompactProp31C1Bridge 2>&1 | tee /tmp/ie-prop31-c1-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentCompactProp31LocalBridge.lean 2>&1 | tee /tmp/ie-prop31-axioms.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentCompactProp31C1Bridge.lean 2>&1 | tee /tmp/ie-prop31-c1-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/ie-prop31-axioms.log; then exit 2; fi
          grep -F 'prop31_local_two_signs_of_joint_derivative_and_slices' /tmp/ie-prop31-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/ie-prop31-c1-axioms.log; then exit 2; fi
          grep -F 'prop31_scalar_current_C1_exact' /tmp/ie-prop31-c1-axioms.log
          grep -F 'prop31_scalar_from_only_C1_hypotheses' /tmp/ie-prop31-c1-axioms.log
          echo 'PROP31_C1_SCALAR_BRIDGE_KERNEL_OK'
      - name: Archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ie-prop31-local-bridge-log
          path: |
            /tmp/ie-prop31-build.log
            /tmp/ie-prop31-axioms.log
            /tmp/ie-prop31-c1-build.log
            /tmp/ie-prop31-c1-axioms.log
          if-no-files-found: ignore
