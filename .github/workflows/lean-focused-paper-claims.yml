# Quick kernel gate for the paper's newest financial/allocative claims.
# The complete Lean audit must still pass before delivery.
name: Lean paper claims (focused, pinned)

on:
  push:
    branches:
      - 'work/lean-ci-validation-*'
    paths:
      - '.github/workflows/lean-focused-paper-claims.yml'
      - 'lean/candidates/Ventura26LiquidityAllocation/PaperRepaymentExactCandidate.lean'
      - 'lean/candidates/Ventura26LiquidityAllocation/PaperAllocationLossElasticityCandidate.lean'
      - 'lean/checkpoint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-paper-claims:
    name: Kernel and axioms for repayment and allocative-loss lemmata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout pinned review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkpoint and construct isolated pinned workspace
        shell: bash
        env:
          PINNED_SHA: 16e24fe828a5a0002ef13bb82bae9e295f190f86
          UPSTREAM_SHA: 194edcc95df74806a39b961d10dedddc6e730cce
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PINNED_SHA" HEAD
          mkdir -p lean-focused-logs
          git clone --quiet --filter=blob:none https://github.com/nikhgarg/AppliedModelingLib.git upstream
          git -C upstream checkout --quiet --detach "$UPSTREAM_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          cmp lean/checkpoint/dependencies/lean-toolchain upstream/lean-toolchain
          cmp lean/checkpoint/dependencies/lake-manifest.json upstream/lake-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          orig=Path("upstream/lakefile.toml").read_bytes()
          candidate=Path("lean/checkpoint/dependencies/lakefile.toml").read_bytes()
          extra=b'\n[[lean_lib]]\nname = "Ventura26LiquidityAllocation"\nsrcDir = "papers"\n'
          assert candidate == orig + extra, "Unexpected change in pinned Lake overlay"
          PY
          cp lean/checkpoint/dependencies/lakefile.toml upstream/lakefile.toml
          mkdir -p upstream/papers/Ventura26LiquidityAllocation
          cp lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean upstream/papers/Ventura26LiquidityAllocation/
          cp lean/checkpoint/module_root.lean upstream/papers/Ventura26LiquidityAllocation.lean
          cp lean/candidates/Ventura26LiquidityAllocation/PaperRepaymentExactCandidate.lean upstream/papers/Ventura26LiquidityAllocation/
          cp lean/candidates/Ventura26LiquidityAllocation/PaperAllocationLossElasticityCandidate.lean upstream/papers/Ventura26LiquidityAllocation/
          sha256sum lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean > lean-focused-logs/checkpoint-sha256.txt
          sha256sum lean/candidates/Ventura26LiquidityAllocation/Paper*Candidate.lean > lean-focused-logs/paper-candidates-sha256.txt
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.30.0-rc2' lean-toolchain
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('lake-manifest.json').read_text())
          refs={x['name']:x['rev'] for x in p['packages']}
          assert refs['mathlib']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          assert refs['cslib']=='95fdc7dc863ff83e9d6c3a68fcb2505540462a4d'
          PY
          lean --version
          lake exe cache get > "$GITHUB_WORKSPACE/lean-focused-logs/mathlib-cache.log" 2>&1 || {
            tail -n 70 "$GITHUB_WORKSPACE/lean-focused-logs/mathlib-cache.log"
            exit 1
          }
      - name: Compile exactly the paper claims 3.1 and 4.3
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          for module in PaperRepaymentExactCandidate PaperAllocationLossElasticityCandidate; do
            echo "::group::Compile $module"
            if lake build "Ventura26LiquidityAllocation.$module" > "$GITHUB_WORKSPACE/lean-focused-logs/$module.log" 2>&1; then
              echo "COMPILED $module"
            else
              tail -n 120 "$GITHUB_WORKSPACE/lean-focused-logs/$module.log"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Audit exact proofs for unsupported axioms
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          cat > FocusedPaperAxioms.lean <<'LEAN'
          import Ventura26LiquidityAllocation.PaperRepaymentExactCandidate
          import Ventura26LiquidityAllocation.PaperAllocationLossElasticityCandidate
          #print axioms Ventura26LiquidityAllocation.ProposedPaperRepaymentExact.exact_repaymentSpec
          #print axioms Ventura26LiquidityAllocation.ProposedPaperAllocationLossElasticity.allocation_loss_log_differential_algebra
          #print axioms Ventura26LiquidityAllocation.ProposedPaperAllocationLossElasticity.output_share_gt_capital_share_iff_productivity
          #print axioms Ventura26LiquidityAllocation.ProposedPaperAllocationLossElasticity.loss_direction_negative_of_reallocation
          LEAN
          lake env lean FocusedPaperAxioms.lean > "$GITHUB_WORKSPACE/lean-focused-logs/axioms.log" 2>&1 || {
            tail -n 120 "$GITHUB_WORKSPACE/lean-focused-logs/axioms.log"
            exit 1
          }
          cat "$GITHUB_WORKSPACE/lean-focused-logs/axioms.log"
          if grep -E '(sorryAx|Lean\.sorryAx)' "$GITHUB_WORKSPACE/lean-focused-logs/axioms.log"; then
            echo "ERROR: a targeted theorem depends on sorryAx"
            exit 1
          fi
          echo "PASS focused Lean kernel and axiom audit"
      - name: Save focused Lean logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-focused-paper-claims-logs
          path: lean-focused-logs/
          retention-days: 30
