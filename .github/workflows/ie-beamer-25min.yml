name: IE Beamer 25-minute exhibition cut
on:
  push:
    paths:
      - slides/final_25min.tex
      - .github/workflows/ie-beamer-25min.yml
  pull_request:
    paths:
      - slides/final_25min.tex
      - .github/workflows/ie-beamer-25min.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-beamer-25min:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile the original-style 18-frame Beamer cut
        uses: xu-cheng/latex-action@v4
        with:
          root_file: slides/final_25min.tex
          work_in_root_file_dir: true
      - name: Verify PDF output exists
        run: test -s slides/final_25min.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: beamer-exposicion-25min
          path: slides/final_25min.pdf
          if-no-files-found: error
