name: IE SOURCE two-date 33-row targetization

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceTwoDateBankTargetization.lean
      - lean/current/CurrentSourceFiveBankTargetization.lean
      - .github/workflows/ie-source-two-date-bank-targetization.yml

permissions:
  contents: read

concurrency:
  group: ie-source-two-date-bank-targetization
  cancel-in-progress: true

jobs:
  source-33-targetization:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile two-date actual SOURCE 33-row lemma and audit axioms
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceFiveBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateBankTargetization.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentSourceTwoDateBankTargetization 2>&1 | tee /tmp/ie-source-two-date-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentSourceTwoDateBankTargetization.lean 2>&1 | tee /tmp/ie-source-two-date-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/ie-source-two-date-axioms.log; then exit 2; fi
          grep -F 'targetizedPrefix33_eq_fullEconomicBankShear' /tmp/ie-source-two-date-axioms.log
          grep -F 'targetizedPrefix33_zero_iff_originalPrefix33_zero' /tmp/ie-source-two-date-axioms.log
          grep -F 'targetizedLogPrefix33_zero_iff_sourceLogPrefix33_zero' /tmp/ie-source-two-date-axioms.log
          echo 'SOURCE_TWO_DATE_33_NONLINEAR_TARGETIZATION_KERNEL_OK'
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-two-date-33-row-targetization
          path: |
            /tmp/ie-source-two-date-build.log
            /tmp/ie-source-two-date-axioms.log
          if-no-files-found: ignore
