name: IE SOURCE exact 33-row shear inverse and Jacobian inverse transport

on:
  pull_request:
    branches: [main]
    paths:
      - lean/current/CurrentSourceTwoDateFDerivInverse.lean
      - code/irf/test_source_banking_shear_exact_inverse.py
      - .github/workflows/ie-source-33-inverse-transport.yml

permissions:
  contents: read

concurrency:
  group: ie-source-33-inverse-transport
  cancel-in-progress: true

jobs:
  source-inverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-project
      - uses: actions/checkout@v4
        with:
          repository: nikhgarg/AppliedModelingLib
          ref: 194edcc95df74806a39b961d10dedddc6e730cce
          path: upstream
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact rational regression on six bank rows and eight coefficients
        shell: bash
        run: |
          set -euo pipefail
          python3 ai-project/code/irf/test_source_banking_shear_exact_inverse.py
      - name: Kernel-check exact SOURCE inverse and conditional target Jacobian bound
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(git rev-parse HEAD)" = "194edcc95df74806a39b961d10dedddc6e730cce"
          lake exe cache get
          cp ../ai-project/lean/checkpoint/dependencies/lakefile.toml ./lakefile.toml
          mkdir -p papers/Ventura26LiquidityAllocation
          cp ../ai-project/lean/checkpoint/module_root.lean papers/Ventura26LiquidityAllocation.lean
          cp ../ai-project/lean/checkpoint/modules/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/candidates/Ventura26LiquidityAllocation/*.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceFiveBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateBankTargetization.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateFDerivTransport.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateFDerivRank.lean papers/Ventura26LiquidityAllocation/
          cp ../ai-project/lean/current/CurrentSourceTwoDateFDerivInverse.lean papers/Ventura26LiquidityAllocation/
          lake build Ventura26LiquidityAllocation.CurrentSourceTwoDateFDerivInverse 2>&1 | tee /tmp/source-inverse-build.log
          lake env lean papers/Ventura26LiquidityAllocation/CurrentSourceTwoDateFDerivInverse.lean 2>&1 | tee /tmp/source-inverse-axioms.log
          if grep -E 'sorryAx|unsolved goals|error:' /tmp/source-inverse-axioms.log; then exit 2; fi
          grep -F 'sourceShearInvCLM_left' /tmp/source-inverse-axioms.log
          grep -F 'sourceShearInvCLM_right' /tmp/source-inverse-axioms.log
          grep -F 'economicLogShearInvCLM_left' /tmp/source-inverse-axioms.log
          grep -F 'twoSidedInverse_of_shear_comp' /tmp/source-inverse-axioms.log
          grep -F 'targetizedLogPrefix33_inverse_from_source' /tmp/source-inverse-axioms.log
          echo SOURCE_33_INVERSE_TRANSPORT_KERNEL_OK
      - name: Preserve kernel and axioms evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-33-inverse-transport
          path: |
            /tmp/source-inverse-build.log
            /tmp/source-inverse-axioms.log
          if-no-files-found: ignore
